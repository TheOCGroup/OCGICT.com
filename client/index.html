  <body>
    <!-- Form contract: the rendered React forms submit urlencoded posts to
         "/" under these exact names. The hosting layer persists every
         submission durably (Firestore on the Cloud Run host; the forms
         service on the legacy host) — never in browser or process memory. -->
    <form name="ocg-contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="form-name" value="ocg-contact" />
      <input name="bot-field" />
      <input name="role" />
      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="message" />
      <input name="details" />
    </form>
    <form name="ocg-g-lead" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input name="name" />
      <input name="email" />
      <input name="phone" />
      <input name="role" />
      <input name="address" />
      <input name="summary" />
      <input name="reference" />
      <input name="source" />
    </form>
    <form name="ocg-seller-intake" data-netlify="true" netlify-honeypot="bot-field" hidden>

      <input name="action" />
      <input name="counterAmount" />
      <input name="preferredWindow" />
      <input name="notes" />
      <input name="reference" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
